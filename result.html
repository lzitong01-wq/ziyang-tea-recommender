        // 读取用户在 index.html 填写的信息；数据损坏时优雅降级，不让整页脚本崩溃
        let userInfo = null;
        try {
            userInfo = JSON.parse(localStorage.getItem('teaUserInfo'));
        } catch (e) {
            userInfo = null;
        }
        if (!userInfo || !userInfo.health || !Array.isArray(userInfo.health) || userInfo.health.length === 0) {
            alert('未检测到有效的填写信息，请先返回首页！');
            window.location.replace('index.html');
            throw new Error('invalid userInfo, redirecting');
        }
        // 字段兜底：兼容旧版本或手工改动过的存储数据，避免 undefined 参与计算
        userInfo.age = typeof userInfo.age === 'string' ? userInfo.age : '';
        userInfo.taste = typeof userInfo.taste === 'string' ? userInfo.taste : '';
        userInfo.constitution = typeof userInfo.constitution === 'string' ? userInfo.constitution : '中性';
        userInfo.health = userInfo.health.filter(h => typeof h === 'string');
        userInfo.scene = typeof userInfo.scene === 'string' ? userInfo.scene : '';
        userInfo.brew = typeof userInfo.brew === 'string' ? userInfo.brew : '无限制';
        userInfo.experience = typeof userInfo.experience === 'string' ? userInfo.experience : '普通';
        userInfo.note = typeof userInfo.note === 'string' ? userInfo.note : '';

        // HTML 转义：用户填写的内容一律转义后再插入 innerHTML，防止 XSS
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        // 同义词表：让表单选项与茶品文案里的不同说法能够匹配
        const effectSynonyms = {
            '补硒': ['补硒'],
            '暖胃': ['暖胃', '养胃'],
            '清热': ['清热'],
            '提神': ['提神'],
            '理气': ['理气']
        };
        const sceneSynonyms = {
            '日常饮用': ['日常饮用', '家庭饮用', '日常待客', '日常品饮', '日常搭配'],
            '办公提神': ['办公提神'],
            '休闲品饮': ['休闲品饮', '休闲放松', '下午茶'],
            '饭后解腻': ['饭后解腻', '解腻'],
            '送礼': ['送礼', '待客']
        };

        function hasEffect(tea, need) {
            return (effectSynonyms[need] || [need]).some(s => tea.功效.includes(s));
        }

        function matchScene(tea, scene) {
            return (sceneSynonyms[scene] || [scene]).some(s => tea.适用场景.includes(s));
        }

        // 打分：满分 100 = 年龄15 + 口味25 + 健康20 + 体质5 + 场景12 + 冲泡8 + 经验15
        function calculateScore(tea) {
            let score = 0;
            score += tea.年龄适配.split(',').includes(userInfo.age) ? 15 : 7;

            const tasteHit = tea.口味.split(',').some(t =>
                t === userInfo.taste || t.includes(userInfo.taste) || userInfo.taste.includes(t));
            score += tasteHit ? 25 : 10;

            const matchedHealth = userInfo.health.filter(h => hasEffect(tea, h));
            score += (matchedHealth.length / userInfo.health.length) * 20;

            if (userInfo.constitution === '中性') score += 5;
            else if (userInfo.constitution === '偏寒' && hasEffect(tea, '暖胃')) score += 5;
            else if (userInfo.constitution === '偏热' && hasEffect(tea, '清热')) score += 5;

            score += matchScene(tea, userInfo.scene) ? 12 : 6;

            if (userInfo.brew === '简单快速') score += tea.冲泡.includes('易冲泡') ? 8 : 4;
            else if (userInfo.brew === '可煮泡') score += tea.冲泡.includes('可煮') ? 8 : 4;
            else score += 8;

            const expOk = (userInfo.experience === '新手' && tea.复杂度 === '低') ||
                          (userInfo.experience === '普通' && ['低', '中'].includes(tea.复杂度)) ||
                          userInfo.experience === '资深';
            score += expOk ? 15 : 10;

            return {
                score: Math.round(score),
                tasteHit,
                matchedHealth
            };
        }

        // 为每款茶计算得分，并保留匹配细节供推荐理由使用
        let allTeas = [];
        for (const [bigCat, teas] of Object.entries(teaDatabase)) {
            teas.forEach(tea => {
                const m = calculateScore(tea);
                allTeas.push({ ...tea, 大类: bigCat, 匹配分: m.score, tasteHit: m.tasteHit, matchedHealth: m.matchedHealth });
            });
        }
        allTeas.sort((a, b) => b.匹配分 - a.匹配分);
        const mainRecommend = allTeas.slice(0, 3);
        const restRecommend = allTeas.slice(3);

        // 生成纯本地 SVG 占位图，避免图片缺失时出现破图，也不依赖外部网络
        function placeholder(text, w, h) {
            const safe = String(text).replace(/[<>&"']/g, '');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="#f0f0f0"/><text x="50%" y="50%" font-size="15" fill="#888" text-anchor="middle" dominant-baseline="middle">${safe}</text></svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function makeImage(src, alt, w, h) {
            const img = document.createElement('img');
            img.className = w > h ? 'tea-extra-img' : 'tea-img';
            img.alt = alt;
            img.src = src;
            img.addEventListener('error', function () {
                this.src = placeholder(alt, w, h);
            });
            return img;
        }

        // 渲染偏好摘要
        function renderSummary() {
            const healthText = escapeHtml(userInfo.health.join('、'));
            const noteText = userInfo.note ? escapeHtml(userInfo.note) : '未填写';
            document.getElementById('preferenceSummary').innerHTML = `
                <div class="summary-title"><i class="fa fa-user-circle" aria-hidden="true"></i> 您的偏好摘要</div>
                <div class="summary-grid">
                    <span>年龄：${escapeHtml(userInfo.age)}岁</span>
                    <span>口味：${escapeHtml(userInfo.taste)}</span>
                    <span>体质：${escapeHtml(userInfo.constitution)}</span>
                    <span>健康需求：${healthText}</span>
                    <span>饮茶场景：${escapeHtml(userInfo.scene)}</span>
                    <span>冲泡偏好：${escapeHtml(userInfo.brew)}</span>
                    <span>饮茶经验：${escapeHtml(userInfo.experience)}</span>
                </div>
                <div class="summary-note"><i class="fa fa-comment-o" aria-hidden="true"></i> 备注：${noteText}</div>
            `;
        }

        // 生成推荐理由：只陈述真正匹配到的项
        function buildReasons(tea) {
            const reasons = [];
            if (tea.年龄适配.includes(userInfo.age)) reasons.push(`适合${escapeHtml(userInfo.age)}岁年龄段`);
            if (tea.tasteHit) reasons.push(`口味「${escapeHtml(userInfo.taste)}」契合`);
            else reasons.push(`口味偏${tea.口味.split(',')[0]}，可作为新尝试`);
            if (tea.matchedHealth.length) reasons.push(`满足「${tea.matchedHealth.join('、')}」需求`);
            if (matchScene(tea, userInfo.scene)) reasons.push(`适合${escapeHtml(userInfo.scene)}场景`);
            if (userInfo.brew === '简单快速' && tea.冲泡.includes('易冲泡')) reasons.push('冲泡简单（3分钟内）');
            if (userInfo.brew === '可煮泡' && tea.冲泡.includes('可煮')) reasons.push('支持煮泡');
            if (userInfo.constitution === '偏寒' && hasEffect(tea, '暖胃')) reasons.push('温和暖胃，适合偏寒体质');
            if (userInfo.constitution === '偏热' && hasEffect(tea, '清热')) reasons.push('清热降火，适合偏热体质');
            return reasons.join('；');
        }

        // 渲染推荐卡片
        function renderList(list, containerId, rankOffset) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach((tea, i) => {
                const rank = i + rankOffset;
                const card = document.createElement('div');
                card.className = 'tea-card';

                const info = document.createElement('div');
                info.className = 'tea-content';
                const text = document.createElement('div');
                text.className = 'tea-info';
                text.innerHTML = `
                    <h3 class="tea-name">${tea.大类} - ${tea.名称}</h3>
                    <div class="tea-score"><i class="fa fa-star" aria-hidden="true"></i> 匹配度：${tea.匹配分}分（满分100）</div>
                    <div class="tea-reason"><span class="reason-label"><i class="fa fa-check-circle" aria-hidden="true"></i> 推荐理由：</span>${buildReasons(tea)}</div>
                    <div class="tea-intro"><span class="intro-label"><i class="fa fa-info-circle" aria-hidden="true"></i> 简介：</span>${tea.简介}</div>
                    <div class="tea-detail">
                        <div class="detail-item"><i class="fa fa-tint" aria-hidden="true"></i> <span class="detail-label">冲泡：</span>${tea.冲泡}</div>
                        <div class="detail-item"><i class="fa fa-user" aria-hidden="true"></i> <span class="detail-label">适合经验：</span>${tea.复杂度 === '低' ? '新手/普通/资深' : tea.复杂度 === '中' ? '普通/资深' : '资深'}</div>
                    </div>
                `;
                const imgWrap = document.createElement('div');
                imgWrap.className = 'tea-img-container';
                imgWrap.appendChild(makeImage(tea.imgName, tea.名称 + '主图', 280, 220));
                info.appendChild(text);
                info.appendChild(imgWrap);
                card.appendChild(info);

                if (tea.extraImgs && tea.extraImgs.length) {
                    const extraWrap = document.createElement('div');
                    extraWrap.className = 'tea-extra-img-container';
                    const title = document.createElement('p');
                    title.className = 'extra-img-title';
                    title.innerHTML = '<i class="fa fa-picture-o" aria-hidden="true"></i> 补充展示';
                    extraWrap.appendChild(title);
                    const gallery = document.createElement('div');
                    gallery.className = 'extra-gallery';
                    tea.extraImgs.forEach((src, idx) => {
                        gallery.appendChild(makeImage(src, tea.名称 + '补充图' + (idx + 1), 800, 300));
                    });
                    extraWrap.appendChild(gallery);
                    card.appendChild(extraWrap);
                }

                const rankEl = document.createElement('div');
                rankEl.className = 'tea-rank' + (rank <= 3 ? ' rank-' + rank : '');
                rankEl.textContent = rank;
                card.appendChild(rankEl);

                const tagEl = document.createElement('div');
                tagEl.className = 'tea-tag';
                tagEl.textContent = tea.tag;
                card.appendChild(tagEl);

                container.appendChild(card);
            });
        }

        renderSummary();
        renderList(mainRecommend, 'mainRecommendList', 1);
        renderList(restRecommend, 'allCategoryList', 4);
    </script>
</body>
</html>
